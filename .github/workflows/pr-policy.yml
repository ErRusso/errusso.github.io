name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const match = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/i);

            if (!match) {
              core.setFailed(
                "A linked issue is required. Add a closing keyword to the description, e.g. `Closes #12`."
              );
              return;
            }

            const issueNumber = Number(match[1]);
            let issue;
            try {
              ({ data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              }));
            } catch (error) {
              core.setFailed(`Issue #${issueNumber} does not exist in this repository.`);
              return;
            }

            if (issue.pull_request) {
              core.setFailed(`#${issueNumber} is a pull request, not an issue.`);
              return;
            }

            if (issue.state === "closed") {
              core.setFailed(`Issue #${issueNumber} is already closed. Link an open issue.`);
              return;
            }

            core.info(`Linked to issue #${issueNumber}: ${issue.title}`);
